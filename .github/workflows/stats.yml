name: Update profile stats
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate public stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Verse1402&show_icons=true&hide_rank=true&hide_border=true&bg_color=101D2B&title_color=A0F0CE&icon_color=A0F0CE&text_color=EEF5F6
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Save updated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/stats.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update public profile stats'
            git push
          fi
